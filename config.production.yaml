# Production-ready default config for Docker / Dokploy deployments.
# The container's entrypoint copies this to /CLIProxyAPI/config.yaml on first
# start if no config.yaml is mounted. Edit via the management UI and persist
# by mounting /CLIProxyAPI/config.yaml from a volume, OR override individual
# values from your reverse-proxied UI's Config page.

host: ""
port: 8317

tls:
  enable: false
  cert: ""
  key: ""

# Management API: secret-key is intentionally blank — production deployments
# should set the MANAGEMENT_PASSWORD env var instead, which the server treats
# as a runtime secret without writing it to disk.
remote-management:
  allow-remote: true
  secret-key: ""
  disable-control-panel: false
  disable-auto-update-panel: true
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"

# Auth tokens (Claude/Gemini/etc OAuth) live here. Mount /CLIProxyAPI/auths
# as a persistent volume in compose so they survive container rebuilds.
auth-dir: "/CLIProxyAPI/auths"

# Replace these with your own strong client keys via the Config page in the UI
# (or by mounting your own config.yaml). Anything calling the proxy must send
# one of these as `Authorization: Bearer <key>`.
api-keys:
  - "change-me-pick-a-strong-client-key"

debug: false

pprof:
  enable: false
  addr: "127.0.0.1:8316"

commercial-mode: false

# Persist logs to /CLIProxyAPI/logs — mount as a volume to keep them across restarts.
logging-to-file: true
logs-max-total-size-mb: 512
error-logs-max-files: 10

# Required for the Dashboard / Usage / Quota pages to show real numbers.
usage-statistics-enabled: true

proxy-url: ""

force-model-prefix: false
passthrough-headers: false

request-retry: 3
max-retry-credentials: 0
max-retry-interval: 30
disable-cooling: false
disable-image-generation: false

quota-exceeded:
  switch-project: true
  switch-preview-model: true
  antigravity-credits: true

routing:
  strategy: "round-robin"
  session-affinity: false
  session-affinity-ttl: "1h"

ws-auth: false
enable-gemini-cli-endpoint: false
nonstream-keepalive-interval: 0
