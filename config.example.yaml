# Fugu-style multi-agent orchestrator (off by default).
# When enabled, an in-process coordinator decides which provider family
# serves each request and, on hard tasks, optionally runs a Thinker /
# Worker / Verifier loop before responding. Account selection within the
# chosen provider stays in the existing round-robin / fill-first
# Selector. See docs/fugu-orchestrator-design.md for the full design.
# orchestrator:
#   enabled: false
#   mode: "auto"                    # auto | single-shot | tri-role
#                                   # "auto" = difficulty-driven (recommended).
#   enabled-for-api-keys: []        # ["*"] = all keys; empty = none.
#   respect-request-headers: true   # honor X-Orchestrator and X-Orchestrator-Mode.
#   policy:
#     kind: "rules"                 # rules | learned
#     rules:
#       # Order each list by preference. The rules policy picks the first
#       # PROVIDER that intersects the request's candidate set. The keys
#       # ("code", "math", "recall", "thinker", "verifier") are
#       # case-sensitive; any provider key the proxy already knows works.
#       defaults:
#         code: ["claude", "antigravity"]
#         math: ["codex", "openai-compatibility"]
#         recall: ["gemini-cli", "vertex"]
#         thinker: ["gemini-cli"]
#         verifier: ["codex"]
#       # Pin the upstream MODEL for a given role/family. Resolution
#       # order at runtime: role-key (thinker|verifier) → family-key
#       # (code|math|recall|general) → "default" → the user's requested
#       # model. Blank entries are ignored. Each pinned model must be
#       # servable by at least one provider listed in the matching
#       # 'defaults' entry above.
#       #
#       # Worked example for "gemini-flash plans, claude-opus codes,
#       # gpt-5 verifies":
#       models:
#         thinker: "gemini-2.5-flash"
#         verifier: "gpt-5"
#         code: "claude-opus-4-5-20251101"
#         math: "gpt-5"
#         recall: "gemini-2.5-pro"
#         default: "gemini-2.5-pro"   # fallback for single-shot mode
#       verifier-must-differ: true
#     learned:
#       socket: "/var/run/llm-proxy/fugu.sock"
#       timeout-ms: 50
#       fallback-on-error: "rules"  # rules | fail
#   budgets:
#     max-turns: 4
#     wall-budget-ms: 60000
#     min-verifier-turns: 1
#     escalate-on-verifier-revise: 1
#     single-shot-fallback-ms: 10000
#   difficulty:
#     enabled: true
#     hard-token-threshold: 2500
#     medium-token-threshold: 500
#     promote-on-tools: false
#   trace:
#     enabled: true
#     dir: "~/.cli-proxy-api/orchestrator-traces"
#     keep-worker-excerpts-chars: 256
#     keep-full-worker-payloads: false  # privacy-sensitive — opt-in
#     rotate-mb: 64
#
#   # ----------------------------------------------------------------
#   # v2: catalog + dynamic categories + optional LLM-based classifier.
#   #
#   # The legacy code/math/recall table above is enough for a handful of
#   # providers. If you have many models across many providers and want
#   # the orchestrator to route intelligently per task, define a catalog
#   # of upstream models and a list of dynamic categories. Each category
#   # describes (in plain English) when it applies, and lists the
#   # catalog ids the policy should prefer for that task. When you
#   # enable the LLM classifier, a cheap upstream model picks the
#   # category per request — no hand-written regex needed.
#   #
#   # Backwards compatible: the policy still consults the old
#   # rules.defaults / rules.models tables when no category matches.
#   # ----------------------------------------------------------------
#   catalog:
#     - id: claude-opus-4.8
#       provider: claude
#       model: claude-opus-4-5-20251101
#       tags: [code, reasoning, long-context, software-engineering]
#       description: "Best for software engineering, refactors, debugging, code review."
#       cost-tier: high
#       latency-tier: mid
#       context-window: 200000
#       supports: [streaming, tools, vision]
#     - id: claude-haiku-4.5
#       provider: claude
#       model: claude-haiku-4-5-20251001
#       tags: [cheap, fast, summarization, classification]
#       description: "Fast/cheap summarization, classification, simple Q&A."
#       cost-tier: cheap
#       latency-tier: fast
#     - id: gpt-5-thinking
#       provider: codex
#       model: gpt-5-thinking
#       tags: [math, planning, reasoning, problem-solving]
#       description: "Strongest for math, planning, multi-step reasoning."
#       cost-tier: high
#     - id: gpt-5-mini
#       provider: openai-compatibility
#       model: gpt-5-mini
#       tags: [cheap, fast, classification]
#       description: "Cheap fast model — good for the LLM classifier itself."
#       cost-tier: cheap
#       latency-tier: fast
#     - id: gemini-3-pro
