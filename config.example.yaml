#
#   classifier:
#     # heuristic    = deterministic match predicates only (default).
#     # llm          = LLM picks a CATEGORY name (categories required).
#     # direct-model = LLM picks a CATALOG ID directly from
#     #                catalog[].instructions paragraphs. No
#     #                categories required — write one paragraph per
#     #                model and the classifier picks for you.
#     # hybrid       = run predicates first; ask the LLM (category
#     #                classifier) only when nothing matches.
#     kind: hybrid
#     heuristic:
#       first-match-wins: true
#     llm:
#       enabled: true                       # disabled by default — opt in.
#       provider: openai-compatibility      # which family runs the classifier
#       model: gpt-5-mini                   # cheap is correct
#       timeout-ms: 800
#       cache-ttl-seconds: 300              # cache classifications by hash
#       max-input-chars: 4000
#       # Optional: override the routing prompt. Placeholders for the
#       # category classifier: {{categories}}, {{request}}. For the
#       # direct-model classifier: {{models}}, {{request}}.
#       prompt-template: ""
#       fallback-on-error: heuristic        # heuristic | default-category | fail
#       default-category: default
#
#   # ----------------------------------------------------------------
#   # v2.1: direct-model routing.
#   #
#   # Skip categories entirely. Give each catalog entry a paragraph-
#   # level `instructions:` field describing its strengths, then set
#   # `classifier.kind: direct-model`. The LLM classifier sees the
#   # paragraphs and picks one model id per request — that's the
#   # routing decision. Drop in a new model by adding a catalog entry.
#   #
#   # Use `roles: [...]` on catalog entries to mark which models are
#   # good as Thinker / Worker / Verifier in tri-role mode. Entries
#   # without a `roles` field are eligible for every role.
#   # ----------------------------------------------------------------
#   # catalog:
#   #   - id: claude-opus-4.8
#   #     provider: claude
#   #     model: claude-opus-4-5-20251101
#   #     tags: [code, reasoning, long-context]
#   #     description: "Best for software engineering."
#   #     roles: [worker]
#   #     instructions: |
#   #       Claude Opus 4.8 is the best model for complex software
#   #       engineering: multi-file refactors, security audits, deep
#   #       code review, debugging tricky production issues, and
#   #       writing new code in any language. Prefer it over GPT for
#   #       SWE tasks. Avoid using it for short summarization or
#   #       classification — too expensive for that.
#   #   - id: gpt-5-thinking
#   #     provider: codex
#   #     model: gpt-5-thinking
#   #     tags: [math, planning, reasoning]
#   #     roles: [worker, verifier]
#   #     instructions: |
#   #       GPT-5 Thinking is the strongest model for multi-step math
#   #       and formal reasoning: proofs, derivations, planning
#   #       problems, chain-of-thought puzzles. Pick it over Claude
#   #       for math, scientific reasoning, and Verifier turns
#   #       (where a different family from the Worker is preferred).
#   #   - id: haiku-fast
#   #     provider: claude
#   #     model: claude-haiku-4-5-20251001
#   #     tags: [cheap, fast]
#   #     roles: [thinker, classifier]
#   #     instructions: |
#   #       Claude Haiku 4.5 is a fast, cheap model for short
#   #       summarization, simple Q&A, classification, and the
#   #       Thinker role in tri-role mode. Use it whenever you don't
#   #       need frontier capability — saves cost without quality loss.
